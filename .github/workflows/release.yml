name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, test and package
        run: |
          $redist = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $redist
          $arguments = @{ RedistPath = $redist }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments.ReleaseTag = $env:GITHUB_REF_NAME }
          ./scripts/package-release.ps1 @arguments
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: |
            out/releases/*.zip
            out/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Create release draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath out/releases -Filter *.zip
          if (@($zip).Count -ne 1) { throw 'Expected exactly one release package.' }
          gh release create $env:GITHUB_REF_NAME $zip.FullName ($zip.FullName + '.sha256') `
            --verify-tag --draft --prerelease --title "Private Pinyin $env:GITHUB_REF_NAME (Windows x64)" `
            --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
